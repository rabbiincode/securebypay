services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securebypay
      POSTGRES_USER: securebypay
      POSTGRES_PASSWORD: securebypay
    ports:
      - "55431:5432"
    volumes:
      - securebypay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebypay"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: securebypay_test
      POSTGRES_USER: securebypay
      POSTGRES_PASSWORD: securebypay
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebypay -d securebypay_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  securebypay_postgres:
