services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securebypay
      POSTGRES_USER: securebypay
      POSTGRES_PASSWORD: securebypay
    ports:
      - "5432:5432"
    volumes:
      - securebypay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securebypay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  securebypay_postgres:

